{% extends 'layouts/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card border-0 shadow-sm" style="border-radius: 16px;">
        <div class="card-header bg-white border-0 pt-4 pb-0">
            <h3 style="font-weight: 800;">Edit Patient Profile</h3>
            <p class="text-muted">Update clinical and personal details for {{ patient.name }}</p>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                
                <h6 class="text-primary fw-bold text-uppercase mb-3" style="letter-spacing: 0.5px;">Personal Information</h6>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label text-muted fw-bold small">Full Name</label>
                        <input type="text" name="name" class="form-control" value="{{ patient.name }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-muted fw-bold small">Age</label>
                        <input type="number" name="age" class="form-control" value="{{ patient.age }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-muted fw-bold small">Phone</label>
                        <input type="text" name="phone" class="form-control" value="{{ patient.phone|default:'' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-muted fw-bold small">Height (cm)</label>
                        <input type="number"
                            step="0.01"
                            name="height"
                            class="form-control"
                            value="{{ patient.height|default:'' }}">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label text-muted fw-bold small">Weight (kg)</label>
                        <input type="number"
                            step="0.01"
                            name="weight"
                            class="form-control"
                            value="{{ patient.weight|default:'' }}">
                    </div>
                    <div class="col-12">
                        <label class="form-label text-muted fw-bold small">Address</label>
                        <textarea name="address" class="form-control" rows="2">{{ patient.address|default:'' }}</textarea>
                    </div>
                </div>

                <h6 class="text-primary fw-bold text-uppercase mb-3" style="letter-spacing: 0.5px;">Clinical Information</h6>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label text-muted fw-bold small">Primary Disease / Diagnosis</label>
                        <input type="text" name="disease" class="form-control" value="{{ patient.disease|default:'' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted fw-bold small">Blood Group</label>
                        <select name="blood_group" class="form-select">
                            <option value="">Select...</option>
                            {% for bg in blood_groups %}
                                <option value="{{ bg }}" {% if patient.blood_group == bg %}selected{% endif %}>{{ bg }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted fw-bold small">Allergies</label>
                        <input type="text" name="allergies" class="form-control" value="{{ patient.allergies|default:'' }}">
                    </div>
                    <div class="col-12">

                        <label class="form-label text-muted fw-bold small">
                            Chronic Conditions
                        </label>

                        <div class="row">

                            <div class="col-md-3">
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="conditions"
                                        value="Diabetes"
                                        {% if "Diabetes" in existing_conditions %}checked{% endif %}
                                    >
                                    <label class="form-check-label">
                                        Diabetes
                                    </label>
                                </div>
                            </div>

                            <div class="col-md-3">
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="conditions"
                                        value="Hypertension"
                                        {% if "Hypertension" in existing_conditions %}checked{% endif %}
                                    >
                                    <label class="form-check-label">
                                        Hypertension
                                    </label>
                                </div>
                            </div>

                            <div class="col-md-3">
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="conditions"
                                        value="Kidney Disease"
                                        {% if "Kidney Disease" in existing_conditions %}checked{% endif %}
                                    >
                                    <label class="form-check-label">
                                        Kidney Disease
                                    </label>
                                </div>
                            </div>

                            <div class="col-md-3">
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="conditions"
                                        value="Liver Disease"
                                        {% if "Liver Disease" in existing_conditions %}checked{% endif %}
                                    >
                                    <label class="form-check-label">
                                        Liver Disease
                                    </label>
                                </div>
                            </div>

                            <div class="col-md-3 mt-2">
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="conditions"
                                        value="Thyroid"
                                        {% if "Thyroid" in existing_conditions %}checked{% endif %}
                                    >
                                    <label class="form-check-label">
                                        Thyroid
                                    </label>
                                </div>
                            </div>

                            <div class="col-md-3 mt-2">
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="conditions"
                                        value="Asthma"
                                        {% if "Asthma" in existing_conditions %}checked{% endif %}
                                    >
                                    <label class="form-check-label">
                                        Asthma
                                    </label>
                                </div>
                            </div>

                            <div class="col-md-3 mt-2">
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="conditions"
                                        value="Heart Disease"
                                        {% if "Heart Disease" in existing_conditions %}checked{% endif %}
                                    >
                                    <label class="form-check-label">
                                        Heart Disease
                                    </label>
                                </div>
                            </div>

                        </div>

                        <div class="mt-3">

                            <label class="form-label text-muted fw-bold small">
                                Other Condition
                            </label>

                            <input
                                type="text"
                                name="custom_condition"
                                class="form-control"
                                placeholder="Enter custom condition"
                                value="{{ custom_condition }}"
                            >

                        </div>

                    </div>
                </div>

                <hr class="my-4">
                
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'patient_history' patient.id %}" class="btn btn-light fw-bold px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary fw-bold px-4" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: none;">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
